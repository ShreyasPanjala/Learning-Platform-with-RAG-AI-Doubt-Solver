version: '3.8'

services:
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: learning_rag_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-default_internal_secret}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-course-doubts-index}
      - GROQ_API_KEY=${GROQ_API_KEY}

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: learning_express_gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key}
      - RAG_SERVICE_URL=http://rag-service:8000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-default_internal_secret}
    depends_on:
      - rag-service

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: learning_react_frontend
    ports:
      - "80:80"
    depends_on:
      - server
